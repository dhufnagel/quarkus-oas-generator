---
openapi: 3.1.0
components:
  schemas:
    Greeting:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: \S
          maxLength: 80
        language:
          $ref: "#/components/schemas/Language"
        birthday:
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        tags:
          type: array
          items:
            type: string
    Language:
      type: string
      enum:
      - GERMAN
      - ENGLISH
    LocalDate:
      type: string
      format: date
      examples:
      - 2022-03-10
paths:
  /greetings:
    get:
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Greeting"
      summary: List Greetings
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Greeting"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greeting"
        "400":
          description: Bad Request
      summary: Create Greeting
  /greetings/{name}:
    get:
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Greeting"
      summary: Get Greeting
    delete:
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      summary: Delete Greeting
info:
  title: Greeting API
  version: 1.0.0
